services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nettrack
      POSTGRES_USER: nettrack
      POSTGRES_PASSWORD: nettrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nettrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://nettrack:nettrack@postgres:5432/nettrack
      DEFAULT_RSC_PATH: /config/ccr2004.rsc
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
